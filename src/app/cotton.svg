<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <filter id="cotton" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="2" seed="7" result="cloud"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="grain"/>
    <feColorMatrix in="cloud" type="matrix"
      values="0 0 0 0 0.86  0 0 0 0 0.80  0 0 0 0 0.70  0 0 0 0.05 0" result="cloudTint"/>
    <feColorMatrix in="grain" type="matrix"
      values="0 0 0 0 0.42  0 0 0 0 0.36  0 0 0 0 0.28  0 0 0 0.035 0" result="grainTint"/>
    <feMerge>
      <feMergeNode in="cloudTint"/>
      <feMergeNode in="grainTint"/>
    </feMerge>
  </filter>
  <rect width="360" height="360" fill="transparent" filter="url(#cotton)"/>
  <g stroke="#a89a8c" stroke-width="0.6" opacity="0.07" stroke-linecap="round">
    <line x1="12" y1="30" x2="40" y2="22"/>
